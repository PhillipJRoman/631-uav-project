[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-efficiency-proj"
version = "2025.0"
description = "Binary classification of UAV flight efficiency from onboard sensor telemetry using Logistic Regression, XGBoost, and Graph Attention Networks. DSCI 631 term project."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  # data management and notebooks
  "dvc>=3.67.1",
  "dvc-gs>=3.0.2",
  "jupytext>=1.19.1",
  # core data stack
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.10.8",
  # classical ML
  "scikit-learn>=1.8.0",
  "xgboost>=2.1",
  # deep learning
  "torch>=2.5",
  "torch-geometric>=2.6",
  "torchvision>=0.26.0",
  "torchaudio>=2.11.0",
  "ipykernel>=7.2.0",
  "wandb>=0.26.1",
  "statsmodels>=0.14.6",
  "pathlib>=1.0.1",
]

[dependency-groups]
# development dependencies for working on the code, but are not needed to run it
dev = [
  # linting and formatting support
  "pre-commit ~= 4.0",
  "ruff >=0.8",
  # ipython tools for interaction
  "ipython >=8",
  "jupyterlab >=3",
  # tools for inspecting common data files
  "parquet-tools >=0.2",
  "visidata >=3",
  # this is super useful for profiling code
  "line_profiler ~=4.1; platform_machine != 'aarch64'",
]

[tool.uv]
python-preference = "managed"

# PyTorch is installed from the default index; on Apple Silicon this provides
# MPS (Metal Performance Shaders) support out of the box. If the project is
# later run on a CUDA machine, a CUDA-specific index can be added here.

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "build", "dist", "*/tests/*", ".pixi/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F403", "F405"]

[tool.pyright]
exclude = [".pixi/*", ".venv/*", "data/*"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
